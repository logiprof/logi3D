name: Publier une version

# Se lance quand on pousse une étiquette de version (ex. v1.6.0).
# Construit logi3d.zip (dossier « logi3d/ ») et le publie dans une release GitHub.
# Les sites WordPress qui ont Logi3D voient alors la mise à jour.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que la version de l'étiquette correspond à logi3d.php
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' logi3d.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "LOGI3D_VERSION'" logi3d.php | sed -E "s/.*'LOGI3D_VERSION', '([^']+)'.*/\1/")
          echo "Étiquette : $TAG · en-tête : $HEADER · constante : $CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::La version de l'étiquette ($TAG) doit être identique à « Version: » ($HEADER) et à LOGI3D_VERSION ($CONST) dans logi3d.php."
            exit 1
          fi

      - name: Construire logi3d.zip
        run: |
          mkdir -p build/logi3d
          rsync -a ./ build/logi3d/ --exclude '.git' --exclude '.github' --exclude 'build' --exclude 'README.md' --exclude '.gitattributes' --exclude '.gitignore'
          cd build && zip -rq ../logi3d.zip logi3d
          cd .. && unzip -l logi3d.zip

      - name: Publier la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" logi3d.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" logi3d.zip --title "Logi3D $GITHUB_REF_NAME" --generate-notes
          fi
