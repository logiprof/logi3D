name: Publier une version

# Se lance à chaque envoi sur « main » (ou à la main depuis l'onglet Actions).
# Lit la version dans logi3d.php. Si la release correspondante (ex. v1.6.0)
# n'existe pas encore : construit logi3d.zip (dossier « logi3d/ ») et la publie.
# Les sites WordPress qui ont Logi3D voient alors la mise à jour.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: v
        run: |
          HEADER=$(grep -m1 -E '^\s*\*\s*Version:' logi3d.php | sed -E 's/.*Version:\s*//' | tr -d '[:space:]')
          CONST=$(grep -m1 "LOGI3D_VERSION'" logi3d.php | sed -E "s/.*'LOGI3D_VERSION', '([^']+)'.*/\1/")
          echo "En-tête : $HEADER · constante : $CONST"
          if [ "$HEADER" != "$CONST" ]; then
            echo "::error::« Version: » ($HEADER) et LOGI3D_VERSION ($CONST) doivent être identiques dans logi3d.php."
            exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"

      - name: Vérifier si cette version est déjà publiée
        id: exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            echo "La version v${{ steps.v.outputs.version }} existe déjà : rien à publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire logi3d.zip
        if: steps.exists.outputs.skip == 'false'
        run: |
          mkdir -p build/logi3d
          git archive HEAD | tar -x -C build/logi3d
          cd build && zip -rq ../logi3d.zip logi3d
          cd .. && unzip -l logi3d.zip

      - name: Publier la release
        if: steps.exists.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" logi3d.zip \
            --target "$GITHUB_SHA" \
            --title "Logi3D v${{ steps.v.outputs.version }}" \
            --generate-notes
