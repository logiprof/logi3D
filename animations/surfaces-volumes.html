.hat{fill:url(#hatch);opacity:0;transition:opacity .6s;pointer-events:none}
.hat.on{opacity:1}
.outline{fill:none;stroke:var(--ink);stroke-width:1.2;transition:stroke .5s,stroke-width .5s;pointer-events:none}
.outline.hl{stroke:var(--accent);stroke-width:3.5}
.tile:hover{filter:brightness(1.05)}

.lbl.off{fill:var(--muted)}
.ft{fill:var(--c)} .fr{fill:color-mix(in srgb,var(--c) 80%,#000)} .fl{fill:color-mix(in srgb,var(--c) 63%,#000)}

#objs,#vol,#dims{pointer-events:none}
.vb{fill:var(--brut);fill-opacity:.07;stroke:var(--brut);stroke-opacity:.55;stroke-dasharray:3 3;stroke-width:.8}
.vf{fill:var(--brut);fill-opacity:.14;stroke:var(--brut);stroke-width:1}
.vt{fill:var(--brut);fill-opacity:.22;stroke:var(--brut);stroke-width:1.3}
.vw{fill:var(--brut);fill-opacity:.025;stroke:var(--brut);stroke-width:.9;stroke-dasharray:4 3;stroke-opacity:.8}
.dim line{stroke:var(--ink);stroke-width:1}

.dim text{font:700 11px var(--body);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.dim.brut line{stroke:var(--brut)} .dim.brut text{fill:var(--brut)}
